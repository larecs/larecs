[workspace]
authors = ["Mose Schmiedel <mose@schmiednet.de>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "scripts"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
build-docs = "python docs.py build"
verify-docs = "python docs.py verify"
test-docs = "python -m unittest test_api_reference test_docs"
check-docs-browser = "python check_docs_browser.py"
test-api-reference = "python -m unittest test_api_reference"
serve-docs = "python docs.py serve"
watch-docs = "python docs.py watch"
figures = "python build_figures.py"

[dependencies]
python = ">=3.14.4,<3.15"
hugo = ">0.148.0,<=0.148.2"
typst = ">=0.15.1,<0.16"

[pypi-dependencies]
perfetto = ">=0.16.0, <0.17"
pymodo = ">=0.11.13, <0.12"
playwright = "==1.58.0"

[target.osx-arm64.dependencies]
go = ">=1.27.3,<2"
