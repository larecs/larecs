[workspace]
authors = ["Mose Schmiedel <mose@schmiednet.de>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "scripts"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
build-docs = "python docs.py build"
test-api-reference = "python -m unittest test_api_reference"
serve-docs = "python docs.py serve"
watch-docs = "python docs.py watch"
figures = { cmd = "typst compile --ignore-system-fonts --font-path docs/figures/fonts --format svg docs/figures/host-execution.typ docs/site/static/images/host-execution.svg", cwd = ".." }

[dependencies]
python = ">=3.14.4,<3.15"
hugo = ">0.148.0,<=0.148.2"
typst = ">=0.15.1,<0.16"

[pypi-dependencies]
perfetto = ">=0.16.0, <0.17"
pymodo = ">=0.11.13, <0.12"

[target.osx-arm64.dependencies]
go = ">=1.27.3,<2"
