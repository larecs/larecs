name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: >-
    ${{ github.event.action == 'closed' && github.event.pull_request.merged
    && startsWith(github.event.pull_request.base.ref, 'release/base-')
    && 'stable-release' || github.run_id }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve package source
    if: >-
      github.event.action != 'closed' ||
      (github.event.pull_request.merged
      && startsWith(github.event.pull_request.base.ref, 'release/base-')
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - uses: actions/checkout@v6
        if: github.event.action == 'closed'
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo 'matrix=[{"os":"ubuntu-latest","target-platform":"linux-64"},{"os":"macos-latest","target-platform":"osx-arm64"}]' >> "$GITHUB_OUTPUT"
          if [[ "$PR_ACTION" == closed ]]; then
            bash scripts/resolve-release.sh "$RELEASE_PR"
          else
            version=1.0.0b1
            if [[ "$BASE_REF" == release/base-v* ]]; then
              version=${BASE_REF#release/base-v}
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build package
    needs: candidate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      LARECS_VERSION: ${{ needs.candidate.outputs.version }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.candidate.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          # needs to be unique for each matrix entry
          artifact-name: package-${{ matrix.target-platform }}
          build-args: >
            --target-platform ${{ matrix.target-platform }}
            --channel conda-forge
            --channel https://repo.prefix.dev/max
            --channel https://repo.prefix.dev/modular-community
            --channel https://prefix.dev/tree-d
            ${{ !startsWith(github.event.pull_request.base.ref, 'release/base-') && '--no-test' || '' }}
  build-gate:
    name: Build gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "All builds completed successfully."
  upload:
    if: needs.candidate.outputs.tag != ''
    name: Upload conda packages to Tree-D Prefix channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing to prefix.dev
    needs: [candidate, build-gate]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.candidate.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.target-platform }}
          path: dist/${{ matrix.target-platform }}
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          setup-only: true
      - name: Upload package to prefix.dev
        shell: bash
        run: |
          mapfile -d '' -t packages < <(find dist -type f \( -name '*.conda' -o -name '*.tar.bz2' \) -print0)
          (( ${#packages[@]} > 0 ))
          for package in "${packages[@]}"; do
            rattler-build upload prefix --channel tree-d "$package"
          done

  release:
    name: Publish GitHub release
    needs: [candidate, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
      PREVIOUS_TAG: ${{ needs.candidate.outputs.previous }}
    steps:
      - name: Tag the reviewed commit
        run: |
          release_type=(--latest)
          if [[ "$RELEASE_TAG" == *b* ]]; then
            release_type=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" --generate-notes --notes-start-tag "$PREVIOUS_TAG" "${release_type[@]}"
      - name: Delete temporary release branches
        run: |
          for branch in "release/base-$RELEASE_TAG" "release/candidate-$RELEASE_TAG"; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            fi
          done
