name: Nightly changelog

# Every PR into `nightly` adds or updates an entry in the Unreleased section
# of changelog.md and links the PR from it, so the section lists every feature
# that reached `nightly` with all PRs that shaped it. Label a PR
# `no-changelog` to skip the check.

on:
  pull_request:
    branches: [nightly]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  check:
    name: Changelog entry
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check changelog entry
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          reference="[#${PR_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})"
          # Lines of the Unreleased section, up to the next release heading.
          if awk '/^## \[Unreleased\]/ { found = 1; next } found && /^## / { exit } found' changelog.md \
            | grep -qF -- "${reference}"; then
            echo "Found the changelog entry for #${PR_NUMBER}."
          else
            echo "::error file=changelog.md::Link #${PR_NUMBER} as ${reference} from a new or updated entry in the Unreleased section, or label the PR 'no-changelog'."
            exit 1
          fi
