<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found – {{ site.Title }}</title>
    <style>
      body {
        color: #000;
        background: #fff;
        margin: 0;
        font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      }
      main {
        min-height: 100vh;
        padding: 0 16px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 500;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
      }
      a {
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #fff;
          background: #000;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page could not be found. Return to the <a href="{{ "" | relURL }}">{{ site.Title }} home page</a>.</p>
    </main>
  </body>
</html>
