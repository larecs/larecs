<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
    <title>Page moved</title>
    <script>location.replace({{ .Permalink | jsonify | safeJS }} + location.hash);</script>
  </head>
  <body><a href="{{ .Permalink }}">Continue to the current page</a>.</body>
</html>
