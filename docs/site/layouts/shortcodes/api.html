{{- /*
Links an API symbol: {{< api Type.method label >}}.
The link follows the site's baseURL, so it also works in PR previews.
*/ -}}
{{- $text := .Get 0 -}}
{{- $link := replace $text "." "#" -}}
{{- with .Get 1 -}}{{- $text = . -}}{{- end -}}
<a href="{{ printf "larecs/%s" $link | relURL }}"><code>{{ $text }}</code></a>
{{- /* keep output on one line */ -}}
