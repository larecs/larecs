baseURL: https://larecs.github.io/larecs/
languageCode: en-us
title: Larecs🌲
disablePathToLower: true

markup:
  highlight:
    noClasses: false

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    # Hugo replaces its default mounts once any mount is declared.
    - source: content
      target: content
    - source: static
      target: static
    - source: layouts
      target: layouts
    - source: assets
      target: assets
    # Documentation example programs, rendered by the `example` shortcode.
    - source: ../../examples
      target: assets/examples

menu:
  sidebar:
    - name: Inside Larecs
      weight: 100
      params:
        type: separator
    - name: Architecture
      pageRef: /inside/architecture
      weight: 101
    - name: Development
      pageRef: /inside/development
      weight: 102
  main:
    - identifier: start
      name: Get started
      pageRef: /start
      weight: 0
    - identifier: guide
      name: User guide
      pageRef: /guide
      weight: 1
    - identifier: larecs
      name: API
      pageRef: /larecs
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/larecs/larecs"
      params:
        icon: github

params:
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # index page by: content | summary | heading | title
      index: content
